name: Live Font Tracker Container

on:
  schedule:
    # Runs automatically every Monday at 4:00 PM UTC (10:00 AM Calgary time)
    - cron: '0 16 * * 1'
  workflow_dispatch:

# Explicitly enforces Node 24 to clear GitHub's upcoming deprecation
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Tracker Script
      run: python tracker.py

    - name: Check for Changes
      id: check_changes
      run: |
        if [[ -n "$(git diff --exit-code)" ]]; then
          echo "Changes detected."
          echo "::set-output name=has_changes::true"
        else
          echo "No changes detected."
          echo "::set-output name=has_changes::false"
        fi

    - name: Commit and Push Changes
      if: steps.check_changes.outputs.has_changes == 'true'
      uses: devops-infra/action-commit-push@v1.5.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        commit_message: "Updated font_metrics.csv"

    - name: Send Success Email
      if: success()
      # Bumped to v4 to fully support Node 24 environments cleanly
      uses: dawidd6/action-send-mail@v4
      with:
        server_address: ${{ secrets.SMTP_SERVER }}
        server_port: ${{ secrets.SMTP_PORT }}
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "Google Fonts Tracker: Task Completed Successfully"
        to: ${{ secrets.RECIPIENT_EMAIL }}
        from: "GitHub Actions Tracker"
        attachments: font_metrics.csv
        body: |
          Hi Dawson,
          
          The gfonts-sil-tracker script has completed successfully on the GitHub Actions Linux runner. The font_metrics.csv file has been updated in the repo as well.
          
          I am attaching the 'font_metrics.csv' which has been updated inside the container sandbox but was intentionally left uncommitted to the repository.

          Have an awesome day!
